# Release: publishes develop as a new version, with one click, built on master, the production
# branch. A release is a merge of develop into master and its tag: the release commit carries
# develop's files as they are at the commit CI checked, with .claude-plugin/plugin.json given the
# release's version, and its parents are master's head (the previous release) and that develop
# commit. So master moves forward by one commit and holds develop's history: right after a release
# GitHub shows master no commit behind develop. develop carries no version and gets nothing from
# the run. The tag vX.Y.Z names the release commit; its version is the last tag's with the part the
# owner picked raised (patch by default).
#
# Started from Actions → Release → Run workflow → Use workflow from: master. A run executes the
# workflow of the branch it starts on, so a release runs this file as the last release left it on
# master, the checks of the job CD: master included, and a change to it here works from the release after the
# one that brings it to master; the release script, the tests and the files are the develop
# commit's. A run on develop is only for that: the run that brings a new Release workflow to master
# (the first release made on master, or a repair), once the owner opened the environment
# `production` to develop (repo-standard.mjs production <owner>/<repo> --bootstrap, or by hand;
# CONTRIBUTING.md, master). GitHub checks each job's `if` without a runner: a run by
# anyone but the repository owner, or on any other branch, is skipped. For the owner the run asks
# nothing more and goes through four jobs, in this order:
#   1. ci checks out develop: first scripts/release-preflight.mjs, which checks that the run can
#      reach master (master's two rulesets and nothing else, merge commits allowed; the environment
#      `production` on master alone, or for a run on develop on develop and master), so a run on
#      the wrong branch stops within seconds; then it names the develop commit it checked, runs the
#      tests, with their counts on the run's summary page, and the dry run of scripts/release.mjs (a
#      develop commit origin holds, a clean tree, the next version, a free tag, the notes). It reads
#      the repository and writes nothing;
#   2. release, only when ci passed, with no credentials, on the develop commit ci named:
#      scripts/release.mjs builds the release commit, runs the tests on it, the files master gets,
#      and tags it with the annotated tag vX.Y.Z (the subjects of develop's commits since the
#      previous release). It pushes nothing; the tag goes to the next job as a git bundle;
#   3. promote (environment `production`, which deploys from master only and holds the secret
#      PRODUCTION_DEPLOY_KEY) runs none of the repository's code: it checks that the bundle's tag is
#      a release commit exactly as job 2 makes one (the highest vX.Y.Z tag; develop's files at a
#      develop commit after the previous release's, with the version line added; master's head and
#      that develop commit as its parents; the subjects of develop's commits since that release in
#      its message and its annotated tag) and pushes the tag, then master, with that deploy key.
#      master's rulesets let only a deploy key create or move master and refuse a deletion or a
#      force push, so master is exactly the latest release and only moves forward. The repository
#      has one deploy key;
#   4. publish: creates the GitHub release from the notes of the tag job 3 checked and pushed,
#      marks it Latest and deletes the older releases; their tags stay as the history.
# A dry run is job 1 alone: it changes nothing and never enters `production`. When master lacks
# the latest tag, or the develop commit is the one that release was made from, a run finishes that
# release (the pushes, the GitHub release) instead of cutting a new one, so a failed run is finished
# by the next one and master skips no version.
#
# Both pushes use the deploy key: the release commit is new to origin and may change
# .github/workflows, which GITHUB_TOKEN may not push. No workflow here runs on a push, so neither
# push starts another run.
name: Release
run-name: ${{ format('{0} {1}', inputs.dry_run && 'Dry run' || 'Release', inputs.bump) }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Dry run - run every check and the tests, change nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: 'CI: tests and checks'
    # IDs survive account renames; the triggering actor covers a re-run started by someone else.
    if: >-
      github.event_name == 'workflow_dispatch'
      && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # the environment production, for the check
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      # develop, the files to release; the run's own commit is master's on a release run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0 # the notes read every commit since the last release; the version reads every tag
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # First, so that a run on the wrong branch, or a setting that would stop the release after its
      # tag, fails within seconds, before the tests. GitHub sets GITHUB_REF_NAME to the run's branch.
      - name: Check that the release can reach master
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-preflight.mjs

      # The release job releases this commit, even when develop moves on during the run. An
      # assignment, not `echo "sha=$(...)"`: under bash -e a failing git then fails the step.
      - name: Name the develop commit to release
        id: source
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The counts, with the name of each failed test, go to the run's summary page. The release job
      # runs the tests again, on the release commit itself; they take seconds.
      - name: Run the tests
        run: |
          set -o pipefail
          status=0
          npm test 2>&1 | tee "$RUNNER_TEMP/tests.txt" || status=$?
          count() { sed -n "s/^ℹ $1 //p" "$RUNNER_TEMP/tests.txt" | tail -n 1; }
          {
            if [ "$status" -eq 0 ]; then echo '### ✅ Tests passed'; else echo '### ❌ Tests failed'; fi
            echo
            if [ -n "$(count tests)" ]; then
              printf '`npm test`: %s passed, %s failed, %s skipped, %s in all.\n' "$(count pass)" "$(count fail)" "$(count skipped)" "$(count tests)"
            else
              echo '`npm test` printed no totals; the log of the step "Run the tests" shows why.'
            fi
            # No failed test: grep finds nothing and exits 1, which under -e and pipefail would end the step.
            grep '^✖ ' "$RUNNER_TEMP/tests.txt" | grep -v '^✖ failing tests:' | sed 's/ ([0-9.]*ms)$//; s/^✖ /- /' | awk '!seen[$0]++' || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The input through the environment, never written into the script.
      - name: Dry run of the release
        env:
          BUMP: ${{ inputs.bump }}
        run: node scripts/release.mjs "$BUMP" --dry-run

  release:
    name: 'CD: release commit and tag'
    needs: [ci]
    # Only after ci passed, and never in a dry run.
    if: >-
      github.event_name == 'workflow_dispatch'
      && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
      && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # The develop commit ci checked and named; origin/develop, origin/master and the tags with it.
      # No credentials: this job runs the repository's code (the tests) and pushes nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci.outputs.source }}
          fetch-depth: 0 # master's head, the release commit's first parent, and the tags
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Commit and tag as the repository's author
        run: |
          git config user.name 'Reywedian'
          git config user.email '27358836+Reywedian@users.noreply.github.com'

      # The script builds the release commit, runs the tests on it and tags it only when they pass.
      # An assignment, not `echo "tag=$(...)"`: under bash -e a failing script then fails the step.
      - name: Test, build the release commit and tag it
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          tag="$(node scripts/release.mjs "$BUMP")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The tag with every commit it needs, for the master job, which checks what it gets.
      - name: Bundle the release commit and its tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: git bundle create release.bundle "refs/tags/$TAG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release.bundle
          if-no-files-found: error
          retention-days: 1

  promote:
    name: 'CD: master'
    needs: [release]
    # A skipped job never sees the deploy key.
    if: >-
      github.event_name == 'workflow_dispatch'
      && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
      && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.promote.outputs.tag }}
    steps:
      # The deploy key, with the run's commit, develop, master and the tags as origin has them. This
      # job runs none of the repository's code: only the check below and git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.PRODUCTION_DEPLOY_KEY }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}

      # The bundle comes from a job that ran the repository's code, so only a release commit leaves
      # it, exactly as the release job makes one: the tag vX.Y.Z, the highest release tag, on
      # develop's files at a develop commit after the one the previous release was made from, with
      # the manifest's version line added (the line the release script writes after "name"); a
      # merge of develop into master, its parents master's head and that develop commit, which its
      # message names, so no history but develop's comes with it; its message and its annotated tag
      # hold the subjects of develop's commits since that previous release, the notes the GitHub
      # release shows. A tag that origin already has under another commit is refused by the fetch.
      # Anything else pushes nothing.
      - name: Check the release commit and push it and its tag
        id: promote
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          refuse() { echo "::error::$TAG is not a release commit of develop: $1. Nothing was pushed."; exit 1; }
          release_tag='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$TAG" =~ $release_tag ]] || refuse 'its name is not vX.Y.Z'
          git fetch "$RUNNER_TEMP/release.bundle" "refs/tags/$TAG:refs/tags/$TAG" \
            || refuse "the bundle lacks it, or origin has $TAG on another commit"
          sha="$(git rev-parse "$TAG^{commit}")"
          master="$(git rev-parse --quiet --verify refs/remotes/origin/master || true)"
          if [ "$sha" = "$master" ]; then
            echo "master already holds $TAG ($sha)."
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          releases="$(git tag --list --sort=-version:refname | grep -E "$release_tag" || true)"
          latest="$(echo "$releases" | head -n 1)"
          [ "$latest" = "$TAG" ] || refuse "$latest is a later release"
          previous="$(echo "$releases" | sed -n 2p)"
          # The develop commit a release was made from; up to v1.0.10 a release was that commit.
          source_of() { git log -1 --format=%B "$1" | sed -n 's/^Source: develop@\([0-9a-f]\{40\}\)$/\1/p'; }
          source="$(source_of "$sha")"
          [ -n "$source" ] || refuse 'its message names no develop commit'
          git merge-base --is-ancestor "$source" refs/remotes/origin/develop || refuse "develop does not hold $source"
          # Parents in this order: master's head, then the develop commit (the first release, with no
          # master yet: that develop commit alone).
          [ "$(git rev-list --parents -n 1 "$sha" | cut -s -d ' ' -f 2-)" = "${master:+$master }$source" ] \
            || refuse "its parents are not master's head and $source, the develop commit its message names"
          since=
          if [ -n "$previous" ]; then
            since="$(source_of "$previous")"
            since="${since:-$(git rev-parse "$previous^{commit}")}"
            [ "$source" != "$since" ] && git merge-base --is-ancestor "$since" "$source" \
              || refuse "it is not made from a develop commit after $since, the one $previous was made from"
          fi
          manifest=.claude-plugin/plugin.json
          version_line="  \"version\": \"${TAG#v}\","
          [ "$(git diff --name-only "$source" "$sha")" = "$manifest" ] || refuse "it changes more than $manifest"
          [ "$(git show "$sha:$manifest" | grep -cxF "$version_line")" = 1 ] || refuse "its $manifest lacks the line $version_line"
          [ "$(git show "$sha:$manifest" | grep -vxF "$version_line")" = "$(git show "$source:$manifest")" ] \
            || refuse "its $manifest changes more than the version"
          notes="$(git log --reverse --format=%s "${since:+$since..}$source" \
            | awk '{ gsub(/^[[:space:]]+|[[:space:]]+$/, "") } $0 != "" { print "- " $0 }')"
          [ "$(git log -1 --format=%B "$sha")" = "$(printf 'Release %s\n\n%s\n\nSource: develop@%s' "$TAG" "$notes" "$source")" ] \
            || refuse "its message is not \"Release $TAG\", the notes of develop's commits since ${previous:-the start} and its develop commit"
          [ "$(git for-each-ref --format='%(objecttype) %(contents)' "refs/tags/$TAG")" = "$(printf 'tag %s\n\n%s' "$TAG" "$notes")" ] \
            || refuse 'its tag is not annotated with the release notes'
          git push origin "refs/tags/$TAG"
          git push origin "$sha:refs/heads/master"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "master is at $TAG ($sha)."

  publish:
    name: 'CD: GitHub release'
    needs: [promote]
    if: >-
      github.event_name == 'workflow_dispatch'
      && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
      && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the annotated tags, whose bodies are the release notes
          persist-credentials: false

      - name: Take the release notes from the tag
        env:
          TAG: ${{ needs.promote.outputs.tag }}
        run: git tag --list --format='%(contents:body)' "$TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Create the GitHub release unless it exists
        env:
          TAG: ${{ needs.promote.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG already exists; nothing to publish."
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag --latest
          fi

      # One release per repository, the latest; its predecessors go, their tags stay as the history.
      # Only after GitHub shows the new release as the latest, so a failed publish never leaves none.
      - name: Keep only the latest release, tags stay
        env:
          TAG: ${{ needs.promote.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "$latest" != "$TAG" ]; then
            echo "The latest release is '$latest', not $TAG; no release deleted."
            exit 0
          fi
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r old; do
            if [ "$old" != "$TAG" ]; then gh release delete "$old" --yes; fi
          done
