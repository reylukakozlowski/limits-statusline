# Release: publishes develop as a new version. A release is a tag: no commit, no release branch,
# no pull request. The version lives only in the tag vX.Y.Z; the manifests carry none, so Claude
# Code tells versions apart by their commit.
#
# Started from Actions → Release → Run workflow, on develop. GitHub checks the job's `if` without
# a runner: a run by anyone but the repository owner, or on any branch but develop, is skipped and
# asks for nothing. For the owner the run waits for the approval of the `release` environment
# before anything runs; after it the job:
#   1. runs scripts/release.mjs: the tests, then the annotated tag vX.Y.Z on develop's head, its
#      message the subjects of the commits since the previous tag, pushed to origin;
#   2. sets the commit status "Release from develop" on that commit: master's ruleset
#      (.github/rulesets/master.json) lets master move only to a commit that carries it. A status,
#      not a check run: GitHub counts workflow checks towards a required check only from events
#      such as push and pull_request, and this run is a workflow_dispatch;
#   3. merges develop into master by fast-forward: master becomes exactly the tagged commit and
#      never moves back;
#   4. creates the GitHub release from the tag's notes, marks it Latest and deletes the older
#      releases; their tags stay as the history.
# A dry run runs the tests and prints the version and the notes; it changes nothing. A run on a
# develop whose head already carries a version tag finishes that release (steps 2-4) instead of
# cutting a new one, so a failed run is finished by running the workflow again.
#
# Pushes use GITHUB_TOKEN, unless the release environment has a RELEASE_TOKEN secret. GitHub lets
# GITHUB_TOKEN point a ref only at a commit whose .github/workflows match the default branch's
# head, which develop's head does; RELEASE_TOKEN (a token with the Workflows permission) is only
# needed when develop moved on with a workflow change before master did. The tag and the master
# push made with GITHUB_TOKEN start no other run.
name: Release
run-name: ${{ format('{0} {1}', inputs.dry_run && 'Dry run' || 'Release', inputs.version || inputs.bump) }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version X.Y.Z instead of the bump (optional)
        type: string
        required: false
        default: ''
      dry_run:
        description: Dry run - run every check and the tests, change nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Test, tag, merge develop into master and publish
    # IDs survive account renames; the triggering actor covers a re-run started by someone else.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the notes read every commit since the last tag; the version reads every tag
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tag as the repository's author
        run: |
          git config user.name 'Reywedian'
          git config user.email '27358836+Reywedian@users.noreply.github.com'

      # An assignment, not `echo "tag=$(...)"`: under bash -e a failing script then fails the step.
      - name: Test and tag develop's head
        id: tag
        env:
          KIND: ${{ inputs.version || inputs.bump }}
          MODE: ${{ inputs.dry_run && '--dry-run' || '--push' }}
        run: |
          tag="$(node scripts/release.mjs "$KIND" "$MODE")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Mark the tagged commit as a release from develop
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        # GitHub now and then answers this call with an error and an empty body (gh then reports
        # "unexpected end of JSON input", as in run 39580647887, whose re-run passed). Setting the
        # same status again is harmless, so a refusal is retried and GitHub's answer is shown.
        run: |
          sha="$(git rev-parse "$TAG^{commit}")"
          answer="$RUNNER_TEMP/status-answer.txt"
          for pause in 5 10 20 0; do
            if gh api --include --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -f state=success -f context='Release from develop' \
              -f description="The Release workflow tagged this head of develop as $TAG" \
              > "$answer" 2>&1; then
              exit 0
            fi
            grep -m 1 '^HTTP/' "$answer" || true
            tail -n 1 "$answer"
            if [ "$pause" -gt 0 ]; then sleep "$pause"; fi
          done
          echo "::error::GitHub refused the status \"Release from develop\" four times; run the workflow again to finish $TAG."
          exit 1

      - name: Merge develop into master
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sha="$(git rev-parse "$TAG^{commit}")"
          git fetch --quiet origin master
          master="$(git rev-parse FETCH_HEAD)"
          if git merge-base --is-ancestor "$sha" "$master"; then
            echo "master already holds $TAG."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$master" "$sha"; then
            echo "::error::master has commits that $TAG lacks, so it cannot move forward to it: master takes changes only from develop."
            exit 1
          fi
          git push origin "$sha:refs/heads/master"
          echo "master is at $TAG ($sha)."

      - name: Take the release notes from the tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: git tag --list --format='%(contents:body)' "$TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Create the GitHub release unless it exists
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG already exists; nothing to publish."
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag --latest
          fi

      # One release per repository, the latest; its predecessors go, their tags stay as the history.
      # Only after GitHub shows the new release as the latest, so a failed publish never leaves none.
      - name: Keep only the latest release, tags stay
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "$latest" != "$TAG" ]; then
            echo "The latest release is '$latest', not $TAG; no release deleted."
            exit 0
          fi
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r old; do
            if [ "$old" != "$TAG" ]; then gh release delete "$old" --yes; fi
          done
