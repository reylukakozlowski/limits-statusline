# Release: publishes a new version. develop is protected (changes only through pull requests, for
# the owner too), so the release commit reaches it through a pull request, and the tag follows the
# merge: Rebase and merge gives the commit a new SHA.
#
#   release  started from Actions → Release → Run workflow, on develop. GitHub checks its `if`
#            without a runner: a run by anyone but the repository owner, or on any branch but
#            develop, is skipped and asks for nothing. For the owner the run then waits for the
#            approval of the `release` environment before anything runs; after it,
#            scripts/release.mjs runs the tests, bumps the version in every manifest, stamps
#            CHANGELOG, commits `LS-N_chore(release): vX.Y.Z` on release/vX.Y.Z, pushes that
#            branch and opens its pull request into develop; the job then merges that pull request
#            (Rebase and merge), tags the merged commit with scripts/tag-release.mjs and hands the
#            tag to publish. A dry run checks all of it and changes nothing. Opening the pull
#            request needs Settings → Actions → General → "Allow GitHub Actions to create and
#            approve pull requests".
#   tag      for a release pull request the owner merged by hand (one the release job could not
#            merge, or one opened from a computer): that merge changes package.json on develop,
#            which starts this job, and it tags like the release job; a version already tagged is
#            passed on as it is.
#   publish  creates the GitHub release from the version's CHANGELOG section, unless it exists.
#
# A tag pushed from a computer starts only the publish job (path filters do not apply to tags).
# The merge and the tag the jobs make start no second run: events made with GITHUB_TOKEN start
# none. Anthropic's directory and the sealoop marketplace both follow develop, so the merge is
# what reaches their users.
name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0} {1}', inputs.dry_run && 'Dry run' || 'Release', inputs.version || inputs.bump) || github.ref_type == 'tag' && format('Publish {0}', github.ref_name) || 'Tag and publish the merged release' }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version X.Y.Z instead of the bump (optional)
        type: string
        required: false
        default: ''
      dry_run:
        description: Dry run - run every check and the tests, change nothing
        type: boolean
        default: false
  push:
    branches: [develop]
    # Every release commit changes package.json, so other merges start no run.
    paths: [package.json]
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Test, bump, commit and open the release pull request
    # IDs survive account renames; the triggering actor covers a re-run started by someone else.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.result.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # LS-N numbering reads every commit subject; the tag check needs every tag

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Commit as the repository's author
        run: |
          git config user.name 'Reywedian'
          git config user.email '27358836+Reywedian@users.noreply.github.com'

      - name: Test, bump, commit, push the release branch and open its pull request
        env:
          KIND: ${{ inputs.version || inputs.bump }}
          MODE: ${{ inputs.dry_run && '--dry-run' || '--push' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs "$KIND" "$MODE"

      # The owner's approval of the release environment is the decision to merge. Only the commit
      # prepared above is merged (--match-head-commit), by rebase, with no rule bypassed. GitHub
      # works out whether a new pull request can merge in the background, so a refusal is retried.
      - name: Merge the release pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="$(git rev-parse --abbrev-ref HEAD)"
          case "$branch" in
            release/v*) ;;
            *) echo "::error::Not on a release branch ($branch): nothing was merged."; exit 1 ;;
          esac
          head="$(git rev-parse HEAD)"
          for pause in 5 10 20 0; do
            if gh pr merge "$branch" --rebase --match-head-commit "$head"; then exit 0; fi
            if [ "$(gh pr view "$branch" --json state --jq .state)" = MERGED ]; then exit 0; fi
            if [ "$pause" -gt 0 ]; then sleep "$pause"; fi
          done
          echo "::error::The pull request of $branch is still open: merge it with Rebase and merge, and the tag job finishes the release."
          exit 1

      # A merge made with GITHUB_TOKEN starts no run, so the tag job would not see it: tag here.
      - name: Tag the merged release commit and push the tag
        id: result
        if: ${{ !inputs.dry_run }}
        run: |
          git fetch --quiet origin develop
          git switch --quiet --detach FETCH_HEAD
          tag="$(node scripts/tag-release.mjs)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  tag:
    name: Tag the merged release
    # No owner check: develop takes changes only through pull requests, and whoever can merge one
    # already decides what the marketplace serves; the tag only names a commit that is there.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.result.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release commit is found in the history; the check needs every tag

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tag as the repository's author
        run: |
          git config user.name 'Reywedian'
          git config user.email '27358836+Reywedian@users.noreply.github.com'

      - name: Tag the merged release commit and push the tag
        id: result
        run: |
          tag="$(node scripts/tag-release.mjs)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish the GitHub release
    needs: [release, tag]
    # After a release or the tag job, or alone for a tag pushed from a computer; a dry run hands
    # over no tag.
    if: ${{ !cancelled() && !failure() && (github.ref_type == 'tag' || needs.release.outputs.tag != '' || needs.tag.outputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || needs.release.outputs.tag || needs.tag.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Take the release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Create the GitHub release unless it exists
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG already exists; nothing to publish."
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
          fi

      # One release per repository, the latest; its predecessors go, their tags stay as the history.
      # Only after GitHub shows the new release as the latest, so a failed publish never leaves none.
      - name: Keep only the latest release, tags stay
        run: |
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "$latest" != "$TAG" ]; then
            echo "The latest release is '$latest', not $TAG; no release deleted."
            exit 0
          fi
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r old; do
            if [ "$old" != "$TAG" ]; then gh release delete "$old" --yes; fi
          done
