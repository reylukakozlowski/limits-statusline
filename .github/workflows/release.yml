# Release: publishes develop as a new version. A release is a tag: no commit, no release branch,
# no pull request. The version lives only in the tag vX.Y.Z; the manifests carry none, so Claude
# Code tells versions apart by their commit.
#
# Started from Actions → Release → Run workflow, on develop. GitHub checks each job's `if` without
# a runner: a run by anyone but the repository owner, or on any branch but develop, is skipped and
# asks for nothing. For the owner the run goes through four jobs, in this order:
#   1. ci (environment `release`): every run, a dry run too, first waits for the owner's approval,
#      and nothing runs before it. Then, in every run, a release too: the tests, with their counts
#      on the run's summary page; the dry run of scripts/release.mjs (develop, a clean tree, the
#      next version, a free tag, the notes); and scripts/release-preflight.mjs, which checks that
#      the run can reach master once it has tagged (master behind develop's head, master's two
#      rulesets and nothing else, the environment `production` on develop alone and waiting for
#      the owner). It reads the repository and writes nothing;
#   2. tag, only when ci passed: scripts/release.mjs runs the tests once more and tags the commit
#      the run started from, the one ci checked, with the annotated tag vX.Y.Z, its message the
#      subjects of the commits since the previous tag, and pushes it with GITHUB_TOKEN;
#   3. promote (environment `production`, which deploys from develop only and holds the secret
#      PRODUCTION_DEPLOY_KEY; the owner approves it too): fast-forwards master to the tagged commit
#      with that deploy key. master's rulesets let only a deploy key create or move master and
#      refuse a deletion, a force push or a merge commit, so master is exactly the latest release
#      and never moves back. The repository has one deploy key, this one;
#   4. publish: creates the GitHub release from the tag's notes, marks it Latest and deletes the
#      older releases; their tags stay as the history.
# A dry run is job 1 alone: it changes nothing and never enters `production`. A run on a develop
# whose head already carries a version tag finishes that release (jobs 3 and 4) instead of cutting
# a new one, so a failed run is finished by running the workflow again; "Re-run failed jobs" after
# a failed tag, promote or publish does not ask for the `release` approval again, ci having passed.
#
# GitHub lets GITHUB_TOKEN point a ref only at a commit whose .github/workflows match the default
# branch's head; the tag sits on develop's head, which always does. The deploy key has no such
# limit, so master catches up even when develop moved on with a workflow change. No workflow here
# runs on a push, so neither push starts another run.
name: Release
run-name: ${{ format('{0} {1}', inputs.dry_run && 'Dry run' || 'Release', inputs.version || inputs.bump) }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version X.Y.Z instead of the bump (optional)
        type: string
        required: false
        default: ''
      dry_run:
        description: Dry run - run every check and the tests, change nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: 'CI: tests and checks'
    # IDs survive account renames; the triggering actor covers a re-run started by someone else.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      actions: read # the environment production, for the check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the notes read every commit since the last tag; the version reads every tag
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The counts, with the name of each failed test, go to the run's summary page. The dry run and
      # the tag run the tests again, as scripts/release.mjs always does; they take seconds.
      - name: Run the tests
        run: |
          set -o pipefail
          status=0
          npm test 2>&1 | tee "$RUNNER_TEMP/tests.txt" || status=$?
          count() { sed -n "s/^ℹ $1 //p" "$RUNNER_TEMP/tests.txt" | tail -n 1; }
          {
            if [ "$status" -eq 0 ]; then echo '### ✅ Tests passed'; else echo '### ❌ Tests failed'; fi
            echo
            if [ -n "$(count tests)" ]; then
              printf '`npm test`: %s passed, %s failed, %s skipped, %s in all.\n' "$(count pass)" "$(count fail)" "$(count skipped)" "$(count tests)"
            else
              echo '`npm test` printed no totals; the log of the step "Run the tests" shows why.'
            fi
            # No failed test: grep finds nothing and exits 1, which under -e and pipefail would end the step.
            grep '^✖ ' "$RUNNER_TEMP/tests.txt" | grep -v '^✖ failing tests:' | sed 's/ ([0-9.]*ms)$//; s/^✖ /- /' | awk '!seen[$0]++' || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Dry run of the release
        env:
          KIND: ${{ inputs.version || inputs.bump }}
        run: node scripts/release.mjs "$KIND" --dry-run

      - name: Check that the release can reach master
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-preflight.mjs

  tag:
    name: 'CD: tag'
    needs: [ci]
    # Only after ci passed, and never in a dry run.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
      && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the notes read every commit since the last tag; the version reads every tag

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tag as the repository's author
        run: |
          git config user.name 'Reywedian'
          git config user.email '27358836+Reywedian@users.noreply.github.com'

      # An assignment, not `echo "tag=$(...)"`: under bash -e a failing script then fails the step.
      - name: Test and tag develop's head
        id: tag
        env:
          KIND: ${{ inputs.version || inputs.bump }}
        run: |
          tag="$(node scripts/release.mjs "$KIND" --push)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  promote:
    name: 'CD: master'
    needs: [tag]
    # Never in a dry run: a skipped job asks for no approval and never sees the deploy key.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
      && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0 # origin/develop and origin/master, to check where the tag sits
          ssh-key: ${{ secrets.PRODUCTION_DEPLOY_KEY }}

      - name: Fast-forward master to the release commit
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
          sha="$(git rev-parse "$TAG^{commit}")"
          if ! git merge-base --is-ancestor "$sha" origin/develop; then
            echo "::error::$TAG is not on develop, so master does not take it."
            exit 1
          fi
          if git rev-parse --quiet --verify refs/remotes/origin/master > /dev/null; then
            if git merge-base --is-ancestor "$sha" origin/master; then
              echo "master already holds $TAG."
              exit 0
            fi
            if ! git merge-base --is-ancestor origin/master "$sha"; then
              echo "::error::master has commits that $TAG lacks, so it cannot move forward to it: master takes changes only from develop."
              exit 1
            fi
          fi
          # A plain push: master's history ruleset refuses anything but a fast-forward.
          git push origin "$sha:refs/heads/master"
          echo "master is at $TAG ($sha)."

  publish:
    name: 'CD: GitHub release'
    needs: [tag, promote]
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
      && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the annotated tags, whose bodies are the release notes
          persist-credentials: false

      - name: Take the release notes from the tag
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: git tag --list --format='%(contents:body)' "$TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Create the GitHub release unless it exists
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG already exists; nothing to publish."
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag --latest
          fi

      # One release per repository, the latest; its predecessors go, their tags stay as the history.
      # Only after GitHub shows the new release as the latest, so a failed publish never leaves none.
      - name: Keep only the latest release, tags stay
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "$latest" != "$TAG" ]; then
            echo "The latest release is '$latest', not $TAG; no release deleted."
            exit 0
          fi
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r old; do
            if [ "$old" != "$TAG" ]; then gh release delete "$old" --yes; fi
          done
