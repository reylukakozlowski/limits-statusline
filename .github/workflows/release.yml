# Publishes a GitHub release when a version tag is pushed (npm run release -- <kind> --push).
# Tests run locally before the tag exists; this workflow only publishes.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Take the release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
