# Release: publishes develop as a new version. The owner starts it from Actions → Release → Run
# workflow with "Use workflow from" left at develop, the default branch, so a run executes this
# file as develop has it: a change here works from the next run. A release is a merge of develop
# into master, the production branch users install from, and its tag: the release commit carries
# develop's files as they are at the run's commit (github.sha, develop when the owner clicked),
# with .claude-plugin/plugin.json given the release's version, and its parents are master's head
# (the previous release) and that develop commit. So master moves forward by one commit and holds
# develop's history: right after a release GitHub shows master no commit behind develop. develop
# carries no version and gets nothing from the run. The version is the highest vX.Y.Z tag's with
# the part the owner picked raised (patch by default).
#
# Every job but refuse runs only for a workflow_dispatch on develop by the repository owner
# (GitHub checks each job's `if` without a runner); refuse runs only otherwise and fails, saying
# why. For the owner the jobs run in this order, each only after the one before passed:
#   1. approval (environment `release`, whose one required reviewer is the owner): GitHub holds the
#      run before any step until the owner approves it under Review deployments. Claude never
#      approves or rejects a release;
#   2. merge, with no credentials: refuses a note of more than one line or 500 characters, then
#      scripts/release.mjs refuses a develop commit master already holds (nothing new) or one that
#      lacks the release on master's develop commit, builds the release commit, runs the tests on
#      it, the files master gets, and only then tags it with the annotated tag vX.Y.Z (the owner's
#      note, then the subjects of the develop commits master lacks). It pushes nothing; the tag
#      goes to the next job as a git bundle;
#   3. promote (environment `production`, which deploys from develop only and holds the secret
#      PRODUCTION_DEPLOY_KEY) runs none of the repository's code: first it asks GitHub whether the
#      owner approved this run in the environment release (a deleted release would come back
#      without its reviewer and let the run through unapproved); then it checks that the bundle's
#      tag is the release commit job 2 tested, a merge of exactly master's head and the run's
#      commit that adds the version line and nothing else, the highest release, and that its
#      message and annotation carry the notes it works out itself from the form and git; then it
#      pushes the tag and master in one atomic push with that deploy key, both or neither.
#      master's rulesets let only a deploy key move master and refuse a deletion or a force push;
#   4. publish: creates the GitHub release from the notes of the tag job 3 pushed, marks it Latest
#      and, once GitHub shows it as the latest, deletes the older releases; their tags stay.
# A run that fails before job 3's push changes nothing: run it again. One that fails after it is
# finished by Re-run failed jobs: job 3 pushes nothing when master already holds its tag, and job 4
# skips a release that exists.
#
# The push uses the deploy key: the release commit is new to origin and may change
# .github/workflows, which GITHUB_TOKEN may not push. No workflow here runs on a push, so the push
# starts no other run.
name: Release
run-name: Release ${{ inputs.bump }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      notes:
        description: Release note, optional - one line, at most 500 characters
        type: string
        required: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  refuse:
    name: Refuse
    # The other jobs' condition turned round: exactly the runs every other job skips.
    if: >-
      github.event_name != 'workflow_dispatch'
      || github.ref != 'refs/heads/develop'
      || github.actor_id != github.repository_owner_id
      || github.triggering_actor != github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Say why nothing is released
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "::error::A release is started by $OWNER from Actions → Release → Run workflow, on develop. This run ($EVENT on $REF by $ACTOR) releases nothing."
          exit 1

  approval:
    name: Approval
    # IDs survive account renames; the triggering actor covers a re-run started by someone else.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/develop'
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # GitHub holds the job before its first step until the owner approves it (up to 30 days).
    environment: release
    permissions: {}
    steps:
      - name: Record the owner's approval
        env:
          BUMP: ${{ inputs.bump }}
          SHA: ${{ github.sha }}
        run: echo "The owner approved a $BUMP release of develop at $SHA."

  merge:
    name: Merge and test
    needs: [approval]
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/develop'
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      # First, before anything is fetched. C.UTF-8, so that ${#NOTES} counts characters, not bytes.
      - name: Check the note
        env:
          NOTES: ${{ inputs.notes }}
          LC_ALL: C.UTF-8
        run: |
          case "$NOTES" in
            *$'\n'* | *$'\r'*) echo '::error::The note has more than one line: give it on one line.'; exit 1 ;;
          esac
          if [ "${#NOTES}" -gt 500 ]; then
            echo "::error::The note has ${#NOTES} characters, more than 500."
            exit 1
          fi
          echo "The note: ${NOTES:-none}"

      # The run's commit, develop when the owner clicked: a pull request merged while the run waited
      # for the approval is not part of this release. No credentials: this job runs the repository's
      # code (the tests) and pushes nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # master's head, the release commit's first parent, and every tag, for the version
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Commit and tag as the repository's author
        run: |
          git config user.name 'Reywedian'
          git config user.email '27358836+Reywedian@users.noreply.github.com'

      # The script builds the release commit, runs the tests on it and tags it only when they pass.
      # Assignments, not `echo "tag=$(...)"`: under bash -e a failing command then fails the step.
      - name: Merge develop into master, test it and tag it
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          NOTES: ${{ inputs.notes }}
        run: |
          tag="$(node scripts/release.mjs "$BUMP")"
          commit="$(git rev-parse "refs/tags/$tag^{commit}")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # The tag with every commit it needs, for the promote job, which checks what it gets.
      - name: Bundle the release commit and its tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: git bundle create release.bundle "refs/tags/$TAG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release.bundle
          if-no-files-found: error
          retention-days: 1

  promote:
    name: Push to master
    needs: [merge]
    # A skipped job never sees the deploy key.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/develop'
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      actions: read # the run's approvals
      contents: read
    outputs:
      tag: ${{ steps.promote.outputs.tag }}
    steps:
      # First, before the deploy key is checked out: GitHub's own record that the owner approved
      # this run in the environment release. The approval job passing is not enough: GitHub creates
      # an environment a workflow names when it is missing, with no reviewer, so with release
      # deleted the run would reach this job unapproved, and GitHub then lists no approval.
      - name: Check that the owner approved this run
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error::$1 Nothing was pushed."; exit 1; }
          approved="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/approvals" \
            --jq 'any(.[]; .state == "approved" and .user.login == env.OWNER and any(.environments[]?; .name == "release"))')" \
            || fail "GitHub did not list this run's approvals."
          [ "$approved" = true ] \
            || fail "$OWNER has not approved this run in the environment release (Review deployments → Approve and deploy)."
          echo "$OWNER approved this run in the environment release."

      # The deploy key, with develop, master and the tags as origin has them. This job runs none of
      # the repository's code: only the checks and git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.PRODUCTION_DEPLOY_KEY }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}

      # The bundle comes from a job that ran the repository's code, so only the release commit that
      # job tested leaves it: the annotated tag vX.Y.Z, the highest release tag, on the commit the
      # merge job named; a merge whose parents are master's head and the run's commit, in this
      # order, so no history but develop's comes with it; develop's files at the run's commit with
      # the manifest's version line added (the line the release script writes after "name") and
      # nothing else; the run's commit not in master yet; and a message ("Release vX.Y.Z" and the
      # notes) and an annotation (vX.Y.Z and the notes) whose notes this job works out itself from
      # trusted inputs alone: the owner's note from the form, then the subjects of the develop
      # commits master lacks, as the release script writes them. A tag that origin already has
      # under another commit is refused by the fetch. When master already holds the tag (a re-run
      # after the push), nothing is left to push. Anything else pushes nothing.
      - name: Check the release commit and push it and its tag
        id: promote
        env:
          TAG: ${{ needs.merge.outputs.tag }}
          COMMIT: ${{ needs.merge.outputs.commit }}
          SHA: ${{ github.sha }}
          NOTES: ${{ inputs.notes }}
        run: |
          refuse() { echo "::error::$TAG is not the release this run made: $1. Nothing was pushed."; exit 1; }
          release_tag='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$TAG" =~ $release_tag ]] || refuse 'its name is not vX.Y.Z'
          git fetch "$RUNNER_TEMP/release.bundle" "refs/tags/$TAG:refs/tags/$TAG" \
            || refuse "the bundle lacks it, or origin has $TAG on another commit"
          [ "$(git cat-file -t "refs/tags/$TAG")" = tag ] || refuse 'it is not an annotated tag'
          sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          [ "$sha" = "$COMMIT" ] || refuse "it names $sha, not $COMMIT, the commit the tests passed on"
          latest="$(git tag --list --sort=-version:refname | grep -E "$release_tag" | head -n 1)"
          [ "$latest" = "$TAG" ] || refuse "$latest is a later release"
          master="$(git rev-parse --quiet --verify refs/remotes/origin/master || true)"
          if [ "$sha" = "$master" ]; then
            echo "master already holds $TAG ($sha)."
          else
            # Parents in this order: master's head, then the run's commit (the first release, with
            # no master yet: the run's commit alone).
            [ "$(git rev-list --parents -n 1 "$sha" | cut -s -d ' ' -f 2-)" = "${master:+$master }$SHA" ] \
              || refuse "its parents are not master's head and $SHA, the develop commit this run releases"
            if [ -n "$master" ] && git merge-base --is-ancestor "$SHA" "$master"; then
              refuse "master holds $SHA already: nothing new since the last release"
            fi
            # The notes as the release script writes them: the note trimmed of spaces and tabs, a
            # blank line, then "- <subject>" per develop commit master lacks, oldest first.
            subjects="$(git log --reverse --no-merges --format=%s "${master:+$master..}$SHA" \
              | awk '{ gsub(/^[[:space:]]+|[[:space:]]+$/, "") } $0 != "" { print "- " $0 }')"
            note="$(printf '%s' "$NOTES" | awk '{ gsub(/^[ \t]+|[ \t]+$/, ""); print }')"
            notes="$subjects"
            [ -z "$note" ] || notes="$note"$'\n\n'"$subjects"
            [ "$(git log -1 --format=%B "$sha")" = "Release $TAG"$'\n\n'"$notes" ] \
              || refuse "its message is not \"Release $TAG\" and the release notes: the owner's note, then develop's commits that master lacks"
            [ "$(git for-each-ref --format='%(contents)' "refs/tags/$TAG")" = "$TAG"$'\n\n'"$notes" ] \
              || refuse 'its tag is not annotated with the release notes'
            manifest=.claude-plugin/plugin.json
            version_line="  \"version\": \"${TAG#v}\","
            [ "$(git diff --name-only "$SHA" "$sha")" = "$manifest" ] || refuse "it changes more than $manifest"
            [ "$(git show "$sha:$manifest" | grep -cxF "$version_line")" = 1 ] || refuse "its $manifest lacks the line $version_line"
            [ "$(git show "$sha:$manifest" | grep -vxF "$version_line")" = "$(git show "$SHA:$manifest")" ] \
              || refuse "its $manifest changes more than the version"
          fi
          # Atomic: origin takes the tag and master together or neither. Never forced.
          git push --atomic origin "refs/tags/$TAG" "$sha:refs/heads/master"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "master is at $TAG ($sha)."

  publish:
    name: GitHub release
    needs: [promote]
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/develop'
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the annotated tags, whose bodies are the release notes
          persist-credentials: false

      - name: Take the release notes from the tag
        env:
          TAG: ${{ needs.promote.outputs.tag }}
        run: git tag --list --format='%(contents:body)' "$TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Create the GitHub release unless it exists
        env:
          TAG: ${{ needs.promote.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG already exists; nothing to publish."
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag --latest
          fi

      # One release per repository, the latest; its predecessors go, their tags stay as the history.
      # Only after GitHub shows the new release as the latest, so a failed publish never leaves none.
      - name: Keep only the latest release, tags stay
        env:
          TAG: ${{ needs.promote.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "$latest" != "$TAG" ]; then
            echo "The latest release is '$latest', not $TAG; no release deleted."
            exit 0
          fi
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r old; do
            if [ "$old" != "$TAG" ]; then gh release delete "$old" --yes; fi
          done
