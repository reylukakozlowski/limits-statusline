# Release: publishes a new version. Start it from Actions → Release → Run workflow, on develop.
#
#   release  first job of the run. GitHub checks its `if` without a runner: a run by anyone but
#            the repository owner, or on any branch but develop, is skipped and asks for nothing.
#            For the owner the run then waits for the approval of the `release` environment before
#            anything runs; after it, scripts/release.mjs runs the tests, bumps the version in every
#            manifest, stamps CHANGELOG, commits `LS-N chore(release): vX.Y.Z`, tags it and sends
#            both to develop in one atomic push. The sealoop marketplace serves develop, so that
#            push is what reaches its users.
#   publish  creates the GitHub release from the version's CHANGELOG section, unless it exists.
#
# A tag pushed from a computer (npm run release -- <kind> --push) starts only the publish job.
# The tag the release job pushes starts no second run: events made with GITHUB_TOKEN start none.
name: Release
run-name: ${{ github.event_name == 'push' && format('Publish {0}', github.ref_name) || format('{0} {1}', inputs.dry_run && 'Dry run' || 'Release', inputs.version || inputs.bump) }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version X.Y.Z instead of the bump (optional)
        type: string
        required: false
        default: ''
      dry_run:
        description: Dry run - run every check and the tests, change nothing
        type: boolean
        default: false
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Test, bump, commit, tag and push
    # IDs survive account renames; the triggering actor covers a re-run started by someone else.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.result.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # LS-N numbering reads every commit subject; the tag check needs every tag

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Commit as the repository's author
        run: |
          git config user.name 'Reywedian'
          git config user.email '27358836+Reywedian@users.noreply.github.com'

      - name: Test, bump, commit, tag and push
        env:
          KIND: ${{ inputs.version || inputs.bump }}
          MODE: ${{ inputs.dry_run && '--dry-run' || '--push' }}
        run: node scripts/release.mjs "$KIND" "$MODE"

      - name: Pass the new tag to the publish job
        id: result
        if: ${{ !inputs.dry_run }}
        run: echo "tag=$(git describe --exact-match HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish the GitHub release
    needs: release
    # After a release, or alone for a tag pushed from a computer; a dry run hands over no tag.
    if: ${{ !cancelled() && !failure() && (github.event_name == 'push' || needs.release.outputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Take the release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Create the GitHub release unless it exists
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG already exists; nothing to publish."
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
          fi
