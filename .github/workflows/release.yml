# Release: publishes develop as a new version, with one click. A release is a commit on master and
# its tag: the release commit carries develop's files as they are at the run's commit, with
# .claude-plugin/plugin.json given the release's version, and its parent is the previous release on
# master, so master moves forward by one commit. develop carries no version and gets nothing from
# the run. The tag vX.Y.Z names the release commit; its version is the last tag's with the part the
# owner picked raised (patch by default).
#
# Started from Actions → Release → Run workflow, on develop. GitHub checks each job's `if` without
# a runner: a run by anyone but the repository owner, or on any branch but develop, is skipped. For
# the owner the run asks nothing more and goes through four jobs, in this order:
#   1. ci: the tests, with their counts on the run's summary page; the dry run of
#      scripts/release.mjs (develop, a clean tree, the next version, a free tag, the notes); and
#      scripts/release-preflight.mjs, which checks that the run can reach master (master's two
#      rulesets and nothing else, the environment `production` on develop alone). It reads the
#      repository and writes nothing;
#   2. release, only when ci passed, with no credentials: scripts/release.mjs runs the tests once
#      more on the commit ci checked, builds the release commit on master's head and tags it with
#      the annotated tag vX.Y.Z (the subjects of develop's commits since the previous release). It
#      pushes nothing; the tag goes to the next job as a git bundle;
#   3. promote (environment `production`, which deploys from develop only and holds the secret
#      PRODUCTION_DEPLOY_KEY) runs none of the repository's code: it checks that the bundle's tag is
#      a release commit (develop's files with the version line added, on master's head, naming a
#      develop commit) and pushes the tag, then master, with that deploy key. master's rulesets let
#      only a deploy key create or move master and refuse a deletion, a force push or a merge
#      commit, so master is exactly the latest release and only moves forward. The repository has
#      one deploy key;
#   4. publish: creates the GitHub release from the tag's notes, marks it Latest and deletes the
#      older releases; their tags stay as the history.
# A dry run is job 1 alone: it changes nothing and never enters `production`. When master lacks
# the latest tag, or develop's head is the commit that release was made from, a run finishes that
# release (the pushes, the GitHub release) instead of cutting a new one, so a failed run is finished
# by the next one and master skips no version.
#
# Both pushes use the deploy key: the release commit is new to origin and may change
# .github/workflows, which GITHUB_TOKEN may not push. No workflow here runs on a push, so neither
# push starts another run.
name: Release
run-name: ${{ format('{0} {1}', inputs.dry_run && 'Dry run' || 'Release', inputs.bump) }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Dry run - run every check and the tests, change nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: 'CI: tests and checks'
    # IDs survive account renames; the triggering actor covers a re-run started by someone else.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # the environment production, for the check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the notes read every commit since the last release; the version reads every tag
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The counts, with the name of each failed test, go to the run's summary page. The dry run and
      # the release run the tests again, as scripts/release.mjs always does; they take seconds.
      - name: Run the tests
        run: |
          set -o pipefail
          status=0
          npm test 2>&1 | tee "$RUNNER_TEMP/tests.txt" || status=$?
          count() { sed -n "s/^ℹ $1 //p" "$RUNNER_TEMP/tests.txt" | tail -n 1; }
          {
            if [ "$status" -eq 0 ]; then echo '### ✅ Tests passed'; else echo '### ❌ Tests failed'; fi
            echo
            if [ -n "$(count tests)" ]; then
              printf '`npm test`: %s passed, %s failed, %s skipped, %s in all.\n' "$(count pass)" "$(count fail)" "$(count skipped)" "$(count tests)"
            else
              echo '`npm test` printed no totals; the log of the step "Run the tests" shows why.'
            fi
            # No failed test: grep finds nothing and exits 1, which under -e and pipefail would end the step.
            grep '^✖ ' "$RUNNER_TEMP/tests.txt" | grep -v '^✖ failing tests:' | sed 's/ ([0-9.]*ms)$//; s/^✖ /- /' | awk '!seen[$0]++' || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The input through the environment, never written into the script.
      - name: Dry run of the release
        env:
          BUMP: ${{ inputs.bump }}
        run: node scripts/release.mjs "$BUMP" --dry-run

      - name: Check that the release can reach master
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-preflight.mjs

  release:
    name: 'CD: release commit and tag'
    needs: [ci]
    # Only after ci passed, and never in a dry run.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
      && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # The run's commit on the branch develop, the one ci checked; origin/master and the tags with
      # it. No credentials: this job runs the repository's code (the tests) and pushes nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Commit and tag as the repository's author
        run: |
          git config user.name 'Reywedian'
          git config user.email '27358836+Reywedian@users.noreply.github.com'

      # An assignment, not `echo "tag=$(...)"`: under bash -e a failing script then fails the step.
      - name: Test, build the release commit and tag it
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          tag="$(node scripts/release.mjs "$BUMP")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The tag with every commit it needs, for the master job, which checks what it gets.
      - name: Bundle the release commit and its tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: git bundle create release.bundle "refs/tags/$TAG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release.bundle
          if-no-files-found: error
          retention-days: 1

  promote:
    name: 'CD: master'
    needs: [release]
    # A skipped job never sees the deploy key.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
      && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
    steps:
      # The deploy key, with develop at the run's commit, master and the tags as origin has them.
      # This job runs none of the repository's code: only the check below and git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.PRODUCTION_DEPLOY_KEY }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}

      # The bundle comes from a job that ran the repository's code, so only a release commit leaves
      # it: develop's files with the manifest's version line added (the line the release script
      # writes after "name"), on master's head, naming a develop commit. A tag that origin already
      # has under another commit is refused by the fetch. Anything else pushes nothing.
      - name: Check the release commit and push it and its tag
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          refuse() { echo "::error::$TAG is not a release commit of develop: $1. Nothing was pushed."; exit 1; }
          git fetch "$RUNNER_TEMP/release.bundle" "refs/tags/$TAG:refs/tags/$TAG" \
            || refuse "the bundle lacks it, or origin has $TAG on another commit"
          sha="$(git rev-parse "$TAG^{commit}")"
          master="$(git rev-parse --quiet --verify refs/remotes/origin/master || true)"
          if [ "$sha" = "$master" ]; then
            echo "master already holds $TAG ($sha)."
            exit 0
          fi
          manifest=.claude-plugin/plugin.json
          version_line="  \"version\": \"${TAG#v}\","
          source="$(git log -1 --format=%B "$sha" | sed -n 's/^Source: develop@\([0-9a-f]\{40\}\)$/\1/p')"
          [ -n "$source" ] || refuse 'its message names no develop commit'
          git merge-base --is-ancestor "$source" refs/remotes/origin/develop || refuse "develop does not hold $source"
          [ "$(git rev-list --parents -n 1 "$sha" | cut -s -d ' ' -f 2-)" = "$master" ] || refuse "its parent is not master's head"
          [ "$(git diff --name-only "$source" "$sha")" = "$manifest" ] || refuse "it changes more than $manifest"
          [ "$(git show "$sha:$manifest" | grep -cxF "$version_line")" = 1 ] || refuse "its $manifest lacks the line $version_line"
          [ "$(git show "$sha:$manifest" | grep -vxF "$version_line")" = "$(git show "$source:$manifest")" ] \
            || refuse "its $manifest changes more than the version"
          git push origin "refs/tags/$TAG"
          git push origin "$sha:refs/heads/master"
          echo "master is at $TAG ($sha)."

  publish:
    name: 'CD: GitHub release'
    needs: [release, promote]
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
      && github.actor_id == github.repository_owner_id
      && github.triggering_actor == github.repository_owner
      && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the annotated tags, whose bodies are the release notes
          persist-credentials: false

      - name: Take the release notes from the tag
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: git tag --list --format='%(contents:body)' "$TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Create the GitHub release unless it exists
        env:
          TAG: ${{ needs.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG already exists; nothing to publish."
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag --latest
          fi

      # One release per repository, the latest; its predecessors go, their tags stay as the history.
      # Only after GitHub shows the new release as the latest, so a failed publish never leaves none.
      - name: Keep only the latest release, tags stay
        env:
          TAG: ${{ needs.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "$latest" != "$TAG" ]; then
            echo "The latest release is '$latest', not $TAG; no release deleted."
            exit 0
          fi
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r old; do
            if [ "$old" != "$TAG" ]; then gh release delete "$old" --yes; fi
          done
